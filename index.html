<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해산 및 채권신고 공고</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 650px;
      background: #ffffff;
      padding: 50px 40px;
      border: 1px solid #dee2e6;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      line-height: 1.8;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      letter-spacing: 2px;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid #212529;
    }
    .content {
      font-size: 16px;
      text-align: justify;
      word-break: keep-all;
      margin-bottom: 50px;
    }
    .footer {
      text-align: center;
      font-size: 15px;
    }
    .date {
      margin-bottom: 25px;
      font-weight: 500;
    }
    .company-info {
      font-weight: 600;
      line-height: 1.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>해산 및 채권신고 공고</h1>

    <div class="content">
      당 회사는 2026년 [해산 결의 월]월 [해산 결의 일]일 임시주주총회의 결의로 해산하였으므로, 
      당 회사에 대하여 채권이 있으신 분은 본 공고 게재일 익일부터 2개월 이내에 
      그 채권액을 신고하여 주시기 바랍니다.<br><br>
      만약 위 기간 내에 신고가 없을 때에는 상법 제536조에 따라 청산에서 제외됨을 공고합니다.
    </div>

    <div class="footer">
      <div class="date">2026년 [공고 게시 월]월 [공고 게시 일]일</div>
      
      <div class="company-info">
        주식회사 에스엔에이치컨설팅<br>
        경기도 남양주시 별내중앙로 30, 2층 204-에프226호(별내동)<br>
        청산인 이상희
      </div>
    </div>
  </div>

</body>
</html>
